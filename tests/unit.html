<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Riak unit tests</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; color: #1d2b2a; }
    .pass { color: #1f6b4a; }
    .fail { color: #a23a22; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Riak unit tests</h1>
  <ol id="out"></ol>
  <script type="module">
    import * as sim from "../js/sim.js";
    import { rng, hexToHue, BANNED_HUE } from "../js/util.js";
    import { packTank, unpackTank } from "../js/share.js";
    import { STRINGS } from "../js/i18n.js";
    import { FISH, PLANTS, SPOTS, BAITS } from "../js/data.js";
    import * as angler from "../js/angler.js";

    const results = [];
    const out = document.getElementById("out");

    function test(name, fn) {
      let ok = false;
      let detail = "";
      try {
        const r = fn();
        ok = r === true || r === undefined;
        if (r !== true && r !== undefined) detail = JSON.stringify(r);
      } catch (e) {
        detail = String(e && e.stack || e);
      }
      results.push({ name, ok, detail });
      const li = document.createElement("li");
      li.className = ok ? "pass" : "fail";
      li.textContent = (ok ? "PASS " : "FAIL ") + name + (detail ? " - " + detail : "");
      out.appendChild(li);
    }

    function assert(cond, msg) {
      if (!cond) throw new Error(msg || "assertion failed");
    }

    const HOUR = sim.HOUR;
    const T0 = Date.UTC(2026, 10, 7, 9, 0, 0);

    function freshWorld(seedValue) {
      const state = sim.newState();
      sim.seedStarterTank(state, "guppy");
      state.lastTick = T0;
      return { state, r: rng(seedValue) };
    }

    test("seeded rng is deterministic", () => {
      const a = rng(42);
      const b = rng(42);
      for (let i = 0; i < 50; i++) assert(a() === b(), "diverged at " + i);
      const c = rng(43);
      assert(rng(42)() !== c(), "different seeds should differ");
    });

    test("same seed -> same 24 h world", () => {
      const runs = [1, 2].map(() => {
        const { state, r } = freshWorld(7);
        for (let i = 1; i <= 144; i++) sim.tickWorld(state, 10 * 60000, T0 + i * 10 * 60000, r);
        const t = state.tanks[0];
        return JSON.stringify({ w: t.w, n: state.fish.length, plants: t.plants.map((p) => p.g) });
      });
      assert(runs[0] === runs[1], "worlds diverged");
    });

    test("nitrogen cycle turns ammonia into nitrate", () => {
      const { state } = freshWorld(3);
      const tank = state.tanks[0];
      tank.plants = [];
      tank.w.amm = 2;
      tank.w.no2 = 0;
      const no3Before = tank.w.no3;
      for (let i = 1; i <= 24; i++) sim.tickTank(state, tank, HOUR, T0 + i * HOUR);
      assert(tank.w.amm < 0.5, "ammonia stayed high: " + tank.w.amm);
      assert(tank.w.no3 > no3Before, "nitrate did not rise");
    });

    test("plants pull nitrate down", () => {
      const a = freshWorld(5).state;
      const b = freshWorld(5).state;
      const ta = a.tanks[0];
      const tb = b.tanks[0];
      ta.w.no3 = 30;
      tb.w.no3 = 30;
      tb.plants = [];
      for (let i = 1; i <= 12; i++) {
        sim.tickTank(a, ta, HOUR, T0 + i * HOUR);
        sim.tickTank(b, tb, HOUR, T0 + i * HOUR);
      }
      assert(ta.plants.length > 0, "starter has no plants");
      assert(ta.w.no3 < tb.w.no3, "planted " + ta.w.no3 + " vs bare " + tb.w.no3);
    });

    test("water quality is 0-100 and worse when dirty", () => {
      const clean = sim.waterQuality({ amm: 0, no2: 0, no3: 5, bact: 1, algae: 0, glass: 0, temp: 25 });
      const dirty = sim.waterQuality({ amm: 3, no2: 2, no3: 80, bact: 0.3, algae: 0.6, glass: 0.8, temp: 25 });
      const q = (v) => (typeof v === "object" ? v.score ?? v.q ?? v.value : v);
      assert(q(clean) > q(dirty), "clean " + q(clean) + " dirty " + q(dirty));
    });

    test("happy adult pair breeds in a roomy tank", () => {
      const { state } = freshWorld(11);
      const tank = state.tanks[0];
      tank.size = "grand";
      const fish = sim.tankFish(state, tank.id);
      const sp = fish[0].sp;
      const pair = fish.filter((f) => f.sp === sp).slice(0, 2);
      if (pair.length < 2) {
        const extra = sim.newFish(sp, { tank: tank.id, r: rng(1) });
        state.fish.push(extra);
        pair.push(extra);
      }
      pair[0].sex = "f";
      pair[1].sex = "m";
      for (const f of pair) {
        f.adult = true;
        f.mood = 95;
        f.bred = 0;
      }
      const before = state.fish.length;
      const born = sim.tryBreed(state, tank, 100 * HOUR, T0, () => 0.01);
      assert(born.length > 0 && state.fish.length > before, "no fry");
      assert(born.every((b) => b.parents && b.parents.length === 2), "fry missing parents");
    });

    test("offline catch-up is capped and reports a summary", () => {
      const { state } = freshWorld(9);
      state.lastTick = T0 - 30 * 24 * HOUR;
      const summary = sim.catchUp(state, T0, rng(9));
      assert(summary.ms <= sim.MAX_OFFLINE, "gap not capped");
      assert(summary.after && Object.keys(summary.after).length === state.tanks.length, "missing after");
    });

    test("share link round-trips a tank", () => {
      const { state } = freshWorld(4);
      const tank = state.tanks[0];
      const packed = packTank(state, tank, "Juwen");
      const json = JSON.parse(JSON.stringify(packed));
      const visit = unpackTank(json);
      const tankOut = visit.tank || visit;
      assert(tankOut.plants.length === tank.plants.length, "plants lost");
      assert(tankOut.ground.length === 25, "ground length");
      const fishOut = visit.fish || [];
      assert(fishOut.length === sim.tankFish(state, tank.id).length, "fish lost");
    });

    test("bad share payload is rejected", () => {
      let threw = false;
      try {
        unpackTank({ v: 9 });
      } catch (e) {
        threw = true;
      }
      assert(threw, "accepted garbage");
    });

    test("coral genes cross into a named strain", () => {
      const r = rng(21);
      const a = sim.randomGenes(r);
      const b = sim.randomGenes(r);
      const child = sim.crossGenes(a, b, r);
      assert(typeof sim.strainKey(child) === "string", "no strain key");
      assert(sim.strainName(child).length > 0, "no strain name");
    });

    test("levels grow monotonically", () => {
      let last = -1;
      for (let lv = 1; lv <= 20; lv++) {
        const xp = sim.xpForLevel(lv);
        assert(xp > last, "xp not increasing at " + lv);
        assert(sim.levelFromXp(xp) >= lv, "levelFromXp mismatch at " + lv);
        last = xp;
      }
    });

    test("every spot can roll a catch at noon and midnight", () => {
      for (const spot of SPOTS) {
        for (const hour of [12, 0]) {
          const ts = Date.UTC(2026, 10, 7, hour, 0, 0);
          const c = sim.rollCatch(spot.id, ts, null, rng(hour + 1));
          assert(c, "no catch at " + spot.id + " " + hour);
        }
      }
    });

    test("migrate keeps a current save intact", () => {
      const { state } = freshWorld(2);
      const copy = sim.migrate(JSON.parse(JSON.stringify(state)));
      assert(copy.fish.length === state.fish.length, "fish lost on migrate");
      assert(copy.tanks.length === state.tanks.length, "tanks lost on migrate");
    });

    test("no species colour falls in the banned purple band", () => {
      const bad = [];
      for (const list of [FISH, PLANTS]) {
        for (const item of list) {
          for (const c of item.colors || []) {
            const { h, s } = hexToHue(c);
            if (s >= 0.12 && h >= BANNED_HUE[0] && h <= BANNED_HUE[1]) bad.push(item.id + " " + c);
          }
        }
      }
      assert(bad.length === 0, bad.join(", "));
    });

    test("rolled fish colours avoid purple", () => {
      const r = rng(77);
      const bad = [];
      for (const sp of FISH) {
        for (let i = 0; i < 5; i++) {
          for (const c of sim.rollColors(sp, r)) {
            const { h, s } = hexToHue(c);
            if (s >= 0.12 && h >= BANNED_HUE[0] && h <= BANNED_HUE[1]) bad.push(sp.id + " " + c);
          }
        }
      }
      assert(bad.length === 0, bad.slice(0, 5).join(", "));
    });

    test("English and Bahasa Indonesia have the same keys", () => {
      const en = Object.keys(STRINGS.en).sort();
      const id = Object.keys(STRINGS.id).sort();
      const missing = en.filter((k) => !(k in STRINGS.id));
      const extra = id.filter((k) => !(k in STRINGS.en));
      assert(missing.length === 0 && extra.length === 0, { missing, extra });
    });

    // ---------- angler (flick fishing) ----------
    test("fish weight grows with the cube of length", () => {
      const a = angler.fishKg(20);
      const b = angler.fishKg(40);
      assert(Math.abs(b / a - 8) < 0.2, { a, b });
      assert(angler.fishKg(60) > 2 && angler.fishKg(60) < 3.5, angler.fishKg(60));
    });

    test("faster flicks cast further, line upgrades add reach", () => {
      let last = -1;
      for (const v of [0.1, 0.4, 0.8, 1.2, 1.8, 2.4, 3]) {
        const p = angler.flickPower(v);
        assert(p >= last && p >= 0 && p <= 1, { v, p });
        last = p;
      }
      assert(angler.castMetres(0) < angler.castMetres(0.5) && angler.castMetres(0.5) < angler.castMetres(1));
      assert(angler.castMetres(1, 2) > angler.castMetres(1, 0));
      assert(angler.castMetres(1, 2) <= angler.MAX_CAST, angler.castMetres(1, 2));
      assert(angler.crankSpeed(Math.PI * 2, 0.55) === 1 && angler.crankSpeed(0, 0.1) === 0);
    });

    function runFight(sp, size, policy, seed, drag = 1, line = 0) {
      const r = rng(seed);
      const f = angler.newFight(sp, size, false, 30, line);
      for (let i = 0; i < 12000 && !f.outcome; i++) angler.fightStep(f, { reel: policy(f), drag }, 0.05, r);
      return f.outcome;
    }
    const bigFish = FISH.slice().sort((a, b) => b.size[1] - a.size[1])[0];
    const smallFish = FISH.slice().sort((a, b) => a.size[1] - b.size[1])[0];
    const careful = (f) => (f.tension < 0.75 ? 1 : 0);

    test("careful reeling lands small and big fish", () => {
      const results = [];
      for (const [sp, size] of [[smallFish, smallFish.size[1]], [bigFish, bigFish.size[1] * 0.8]]) {
        for (let seed = 1; seed <= 6; seed++) results.push(runFight(sp, size, careful, seed));
      }
      const landed = results.filter((x) => x === "landed").length;
      assert(landed >= results.length - 1, results);
    });

    test("cranking flat out on heavy drag snaps a big fish", () => {
      const results = [];
      for (let seed = 1; seed <= 6; seed++) results.push(runFight(bigFish, bigFish.size[1], () => 1, seed, 2));
      assert(results.filter((x) => x === "snap").length >= 4, results);
    });

    test("never reeling loses the fish", () => {
      const results = [];
      for (let seed = 1; seed <= 6; seed++) results.push(runFight(bigFish, bigFish.size[1] * 0.7, () => 0, seed));
      assert(results.every((x) => x === "unhooked" || x === "spooled"), results);
    });

    test("tackle and cast distance change the odds", () => {
      const spot = "ocean";
      const ts = new Date(2026, 5, 1, 12).getTime();
      const share = (bait, d, pred) => {
        const list = sim.spotCandidates(spot, ts, bait, d);
        const total = list.reduce((a, c) => a + c.w, 0);
        return list.filter((c) => pred(c.sp)).reduce((a, c) => a + c.w, 0) / total;
      };
      const big = (sp) => sp.size[1] >= 30 || sp.rar >= 3;
      assert(share("worm", 1, big) > share("worm", 0, big), "far casts favour big fish");
      // the jig should shift a salt spot's odds toward bottom and big fish
      const bottom = (sp) => sp.beh === "bottom" || sp.size[1] >= 20;
      const saltSpot = SPOTS.find((s) => {
        const here = FISH.filter((f) => f.spots.includes(s.id) && f.water !== "fresh");
        return s.water === "salt" && here.some(bottom) && !here.every(bottom);
      });
      assert(saltSpot, "a salt spot with mixed fish");
      const shareAt = (bait) => {
        const list = sim.spotCandidates(saltSpot.id, ts, bait, 0.5);
        const total = list.reduce((a, c) => a + c.w, 0);
        return list.filter((c) => bottom(c.sp)).reduce((a, c) => a + c.w, 0) / total;
      };
      assert(shareAt("jig") > shareAt("worm"), "jig favours bottom and big sea fish at " + saltSpot.id);
      for (const b of BAITS) assert(angler.TACKLE[b.id], "tackle kind for " + b.id);
    });

    test("CPU anglers are deterministic for a seed", () => {
      const pick = (r) => ({ sp: FISH[0].id, size: 5 + r() * 10 });
      const a = angler.cpuCatches(42, "pond", 180, pick);
      const b = angler.cpuCatches(42, "pond", 180, pick);
      assert(JSON.stringify(a) === JSON.stringify(b));
      assert(a.length === 3 && a.every((p) => p.catches.length > 0), a.map((p) => p.catches.length));
      const ranked = angler.rankPlayers(a, "bigfish");
      assert(ranked[0].score >= ranked[1].score && ranked[1].score >= ranked[2].score);
      assert(angler.tournamentScore([{ at: 10, kg: 1 }, { at: 200, kg: 5 }], "bigcatch", 100) === 1);
    });

    test("challenge links round-trip and reject bad input", () => {
      const sp = FISH.find((f) => f.spots.includes("pond"));
      const code = angler.packDuel({ sp: sp.id, size: sp.size[1] * 0.9, spot: "pond", from: "Ayu" });
      const back = angler.unpackDuel(code);
      assert(back && back.sp === sp.id && back.spot === "pond" && back.from === "Ayu", back);
      assert(angler.unpackDuel("not-a-code") === null);
      assert(angler.unpackDuel(angler.packDuel({ sp: sp.id, size: 9999, spot: "pond" })) === null, "oversized fish");
      assert(angler.unpackDuel(angler.packDuel({ sp: "nope", size: 5, spot: "pond" })) === null, "unknown species");
    });

    test("old saves gain the angler and a starter spinner", () => {
      const old = JSON.parse(JSON.stringify(sim.newState()));
      delete old.angler;
      old.inv.bait = { worm: 999, shrimpbait: 3, glowlure: 0 };
      const s = sim.migrate(old);
      assert(s.angler && Array.isArray(s.angler.album) && s.angler.controls === "flick", s.angler);
      assert(s.inv.bait.spinner === 1 && s.inv.bait.shrimpbait === 3, s.inv.bait);
      const again = sim.migrate(JSON.parse(JSON.stringify(s)));
      assert(again.inv.bait.spinner === 1, "spinner only once");
    });

    test("quests unlock from angler progress", () => {
      const a = angler.newAngler();
      assert(angler.questProgress(a).every((q) => !q.done));
      a.maxCast = 30;
      a.flags.push(...angler.catchFlags({ bait: "fly", spotId: "stream", phase: "night", peak: 0.5, water: "fresh" }));
      const done = angler.questProgress(a).filter((q) => q.done).map((q) => q.id).sort();
      assert(JSON.stringify(done) === JSON.stringify(["cast25", "fly", "night", "smooth"]), done);
    });

    window.__results = results;
    window.__done = true;
  </script>
</body>
</html>
