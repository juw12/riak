<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Riak species sheet (dev)</title>
<style>
  body { margin: 0; padding: 16px; background: #6f9f93; font: 12px system-ui, sans-serif; color: #f4f1ea; }
  .grid { display: grid; grid-template-columns: repeat(6, 220px); gap: 8px; }
  figure { margin: 0; background: linear-gradient(#9cc6b8, #4f8a7c); border-radius: 10px; padding: 4px; }
  canvas { width: 212px; height: 120px; display: block; }
  figcaption { padding: 2px 6px 4px; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script type="module">
  import { FISH } from "../js/data.js";
  import { drawFish } from "../js/draw.js";
  const grid = document.getElementById("grid");
  const silhouettes = new URLSearchParams(location.search).has("sil");
  for (const sp of FISH) {
    const fig = document.createElement("figure");
    const cv = document.createElement("canvas");
    cv.width = 424;
    cv.height = 240;
    fig.append(cv);
    const cap = document.createElement("figcaption");
    cap.textContent = sp.id;
    fig.append(cap);
    grid.append(fig);
    const ctx = cv.getContext("2d");
    ctx.scale(2, 2);
    const L = Math.min(212 * 0.5, 120 * 0.62 / Math.max(0.4, sp.h * 1.6)) * (sp.len > 1.3 ? 0.85 : 1);
    const opts = silhouettes ? { flat: "rgba(30,44,42,0.55)" } : {};
    drawFish(ctx, { id: "sheet" + sp.id, sp: sp.id }, 112, 62, L, 1, 0.6, opts);
  }
  document.body.dataset.ready = "1";
</script>
</body>
</html>
